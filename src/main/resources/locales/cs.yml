          already: "<red>Zde již skleník existuje!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>Střecha obsahuje nepovolené bloky!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>Stěna obsahuje nepovolené bloky!</red>"
          FAIL_BELOW: "<red>Musíš být uvnitř skleníku, abys ho mohl zkusit vytvořit</red>"
          FAIL_BLOCKS_ABOVE: "<red>Nad skleníkem nesmí být žádné bloky! Červené skleněné bloky by měly ukázat problematické bloky.</red>"
          FAIL_HOLE_IN_ROOF: |
            <red>Ve střeše je díra nebo není rovná!</red>
            <red>Červené skleněné bloky by měly ukázat problém.</red>
            <red>Ujisti se, že jsi uvnitř skleníku, abys ho mohl vytvořit.</red>
          FAIL_HOLE_IN_WALL: "<red>Vestěně je díra!</red>"
          FAIL_NO_ROOF: "<red>Zdá se, že zde není střecha! Ujisti se, že jsi uvnitř skleníku, abys ho mohl vytvořit.</red>"
          FAIL_TOO_MANY_DOORS: "<red>Ve skleníku nemůžeš mít více než 4 dveře!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Vestěnách nebo střeše je povolen pouze jeden násypník (hopper).</red>"
          FAIL_UNEVEN_WALLS: "<red>Stěny jsou nerovnoměrné. Červené skleněné bloky by měly ukázat problematické bloky.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Nedostatek ledu k vytvoření tohoto receptu</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Nedostatek lávy k vytvoření tohoto receptu</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Nedostatek vody k vytvoření tohoto receptu</red>"
          FAIL_NO_ICE: "<red>K vytvoření tohoto receptu je vyžadován led</red>"
          FAIL_NO_LAVA: "<red>K vytvoření tohoto receptu je vyžadována láva</red>"
          FAIL_NO_WATER: "<red>K vytvoření tohoto receptu je vyžadována voda</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Nebyl nalezen žádný recept, který by odpovídal tomuto skleníku</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>K vytvoření tohoto receptu je vyžadováno více bloků!</red>"
          FAIL_OVERLAPPING: "<red>Skleníky nemohou sdílet stěny, omlouváme se.</red>"
        success: "<dark_green>Úspěšně jsi vytvořil skleník s biomem [biome]! Biom se synchronizuje při příštím teleportu nebo přihlášení.</dark_green>"
        missing-blocks: "<red>Chybí [material] x [number]</red>"
        unknown-recipe: "<red>Neznámý recept</red>"
        try-these: "<red>Zkus jeden z těchto:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Jak postavit skleník]</green>"
        instructions: |
          <yellow>Vyrob krabici ze skla se 4 stěnami a plochou skleněnou</yellow>
          <yellow>střechou a přidej do stěn až </yellow><white>4 dveře.</white>
          <yellow>Umísti </yellow><white>1 násypník (hopper) </white><yellow>do stěny nebo střechy a přidej kbelíky s vodou,</yellow>
          <yellow>abys automaticky vyráběl sníh a/nebo kostní moučku pro růst rostlin.</yellow>
          <yellow>Podívej se na recepty biomů, jaké bloky musí být uvnitř skleníku,</yellow>
          <yellow>aby byl úspěšně vytvořen.</yellow>

