            <red>Ada lubang di atap atau atap tidak rata!</red>
            <red>Blok kaca merah akan menunjukkan masalahnya.</red>
            <red>Pastikan kamu berada di dalam rumah kaca untuk membuatnya.</red>
          FAIL_HOLE_IN_WALL: "<red>Ada lubang di dinding!</red>"
          FAIL_NO_ROOF: "<red>Sepertinya tidak ada atap! Pastikan kamu berada di dalam rumah kaca.</red>"
          FAIL_TOO_MANY_DOORS: "<red>Kamu tidak boleh memiliki lebih dari 4 pintu di rumah kaca!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Hanya diperbolehkan satu hopper di dinding atau atap.</red>"
          FAIL_UNEVEN_WALLS: "<red>Dinding tidak rata. Blok kaca merah akan menunjukkan blok yang bermasalah.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Es tidak cukup untuk membuat resep ini</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Lava tidak cukup untuk membuat resep ini</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Air tidak cukup untuk membuat resep ini</red>"
          FAIL_NO_ICE: "<red>Es diperlukan untuk membuat resep ini</red>"
          FAIL_NO_LAVA: "<red>Lava diperlukan untuk membuat resep ini</red>"
          FAIL_NO_WATER: "<red>Air diperlukan untuk membuat resep ini</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Tidak ada resep yang cocok untuk rumah kaca ini</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Diperlukan lebih banyak blok untuk membuat resep ini!</red>"
          FAIL_OVERLAPPING: "<red>Maaf, rumah kaca tidak boleh berbagi dinding.</red>"
        success: "<dark_green>Kamu berhasil membuat rumah kaca bioma [biome]! Bioma akan sinkron pada teleportasi atau login berikutnya.</dark_green>"
        missing-blocks: "<red>Kurang [material] x [number]</red>"
        unknown-recipe: "<red>Resep tidak dikenal</red>"
        try-these: "<red>Coba salah satu dari ini:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Cara Membangun Rumah Kaca]</green>"
        instructions: |
          <yellow>Buatlah kotak dari kaca dengan 4 dinding dan atap kaca</yellow>
          <yellow>yang datar, lalu tambahkan hingga </yellow><white>4 pintu </white><yellow>pada dinding.</yellow>
          <yellow>Letakkan </yellow><white>1 hopper </white><yellow>di dinding atau atap dan tambahkan ember air</yellow>
