            <red>C'è un buco nel tetto o non è piatto!</red>
            <red>I blocchi di vetro rosso indicheranno il problema.</red>
            <red>Assicurati di essere all'interno della serra per crearla.</red>
          FAIL_HOLE_IN_WALL: "<red>C'è un buco nella parete!</red>"
          FAIL_NO_ROOF: "<red>Sembra che non ci sia il tetto! Assicurati di essere all'interno della serra per crearla.</red>"
          FAIL_TOO_MANY_DOORS: "<red>Non puoi avere più di 4 porte nella serra!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>È consentita solo una tramoggia (hopper) nelle pareti o nel tetto.</red>"
          FAIL_UNEVEN_WALLS: "<red>Le pareti non sono uniformi. I blocchi di vetro rosso indicheranno i blocchi problematici.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Ghiaccio insufficiente per creare questa ricetta</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Lava insufficiente per creare questa ricetta</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Acqua insufficiente per creare questa ricetta</red>"
          FAIL_NO_ICE: "<red>Il ghiaccio è richiesto per questa ricetta</red>"
          FAIL_NO_LAVA: "<red>La lava è richiesta per questa ricetta</red>"
          FAIL_NO_WATER: "<red>L'acqua è richiesta per questa ricetta</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Nessuna ricetta corrispondente trovata per questa serra</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Sono necessari più blocchi per creare questa ricetta!</red>"
          FAIL_OVERLAPPING: "<red>Spiacenti, le serre non possono condividere le pareti.</red>"
        success: "<dark_green>Hai creato con successo una serra del bioma [biome]! Il bioma si sincronizzerà al prossimo teletrasporto o accesso.</dark_green>"
        missing-blocks: "<red>Mancante [material] x [number]</red>"
        unknown-recipe: "<red>Ricetta sconosciuta</red>"
        try-these: "<red>Prova una di queste:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Come costruire una serra]</green>"
        instructions: |
          <yellow>Crea una scatola di vetro con 4 pareti e un tetto di vetro</yellow>
          <yellow>piatto, aggiungi fino a </yellow><white>4 porte </white><yellow>nelle pareti.</yellow>
          <yellow>Posiziona </yellow><white>1 tramoggia </white><yellow>in una parete o nel tetto e aggiungi secchi d'acqua</yellow>
          <yellow>per creare neve e/o farina d'ossa per far crescere le piante automaticamente.</yellow>
          <yellow>Controlla le ricette dei biomi per sapere quali blocchi devono essere all'interno</yellow>
          <yellow>della serra per crearla con successo.</yellow>

