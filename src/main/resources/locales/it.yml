        description: "Rimuove la serra in cui ti trovi se ne sei il proprietario"        
      make:
        description: "Tenta di creare una serra"
        parameters: "<ricetta>"
        error:
          already: "<red>C'è già una serra qui!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>Il tetto contiene blocchi non consentiti!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>Le pareti contengono blocchi non consentiti!</red>"
          FAIL_BELOW: "<red>Devi essere all'interno della serra per provare a crearla</red>"
          FAIL_BLOCKS_ABOVE: "<red>Non possono esserci blocchi sopra la serra! I blocchi di vetro rosso indicheranno i blocchi problematici.</red>"
