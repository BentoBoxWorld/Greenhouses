   nootherblocks: "Nu sunt necesare alte blocuri."
   missing: "Sera lipsește"
   
  commands:
    user:
      description: "Deschide meniul de selecție a serelor"
      remove:
        description: "Șterge sera în care te afli, dacă ești proprietarul"        
      make:
        description: "Încearcă să creezi o seră"
        parameters: "<rețetă>"
        error:
          already: "<red>Există deja o seră aici!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>Acoperișul conține blocuri nepermise!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>Pereții conțin blocuri nepermise!</red>"
          FAIL_BELOW: "<red>Trebuie să fii în interiorul serei pentru a încerca să o creezi</red>"
          FAIL_BLOCKS_ABOVE: "<red>Nu pot exista blocuri deasupra serei! Blocurile de sticlă roșie vor indica blocurile problematice.</red>"
          FAIL_HOLE_IN_ROOF: |
            <red>Există o gaură în acoperiș sau acesta nu este plat!</red>
            <red>Blocurile de sticlă roșie vor indica problema.</red>
            <red>Asigură-te că ești în interiorul serei pentru a o crea.</red>
          FAIL_HOLE_IN_WALL: "<red>Există o gaură în perete!</red>"
          FAIL_NO_ROOF: "<red>Se pare că nu există acoperiș! Asigură-te că ești în interiorul serei pentru a o crea.</red>"
          FAIL_TOO_MANY_DOORS: "<red>Nu poți avea mai mult de 4 uși în seră!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Este permisă o singură pâlnie (hopper) în pereți sau acoperiș.</red>"
          FAIL_UNEVEN_WALLS: "<red>Pereții sunt inegali. Blocurile de sticlă roșie vor indica blocurile problematice.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Gheață insuficientă pentru această rețetă</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Lavă insuficientă pentru această rețetă</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Apă insuficientă pentru această rețetă</red>"
          FAIL_NO_ICE: "<red>Gheața este necesară pentru această rețetă</red>"
          FAIL_NO_LAVA: "<red>Lava este necesară pentru această rețetă</red>"
          FAIL_NO_WATER: "<red>Apa este necesară pentru această rețetă</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Nu a fost găsită nicio rețetă corespunzătoare pentru această seră</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Sunt necesare mai multe blocuri pentru această rețetă!</red>"
          FAIL_OVERLAPPING: "<red>Ne pare rău, serele nu pot împărți pereți comuni.</red>"
        success: "<dark_green>Ai creat cu succes o seră cu biometul [biome]! Biometul se va sincroniza la următoarea teleportare sau conectare.</dark_green>"
        missing-blocks: "<red>Lipsesc [material] x [number]</red>"
        unknown-recipe: "<red>Rețetă necunoscută</red>"
        try-these: "<red>Încearcă una dintre acestea:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Cum să construiești o seră]</green>"
        instructions: |
          <yellow>Construiește o cutie din sticlă cu 4 pereți și un</yellow>
          <yellow>acoperiș plat din sticlă, și adaugă până la </yellow><white>4 uși </white><yellow>în pereți.</yellow>
          <yellow>Plasează </yellow><white>1 pâlnie </white><yellow>într-un perete sau acoperiș și adaugă</yellow>
          <yellow>găleți cu apă pentru a crea zăpadă și/sau făină de oase</yellow>
          <yellow>pentru creșterea automată. Verifică rețetele de biomet pentru</yellow>
          <yellow>a vedea ce blocuri trebuie să fie în interior.</yellow>

