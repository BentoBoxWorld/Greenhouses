          FAIL_TOO_MANY_HOPPERS: "<red>Dopušten je samo jedan lijevak (hopper) u zidovima ili krovu.</red>"
          FAIL_UNEVEN_WALLS: "<red>Zidovi su neravni. Crveni stakleni blokovi trebali bi pokazati problematične blokove.</red>"
