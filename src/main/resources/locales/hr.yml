          FAIL_INSUFFICIENT_LAVA: "<red>Nedovoljno lave za ovaj recept</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Nedovoljno vode za ovaj recept</red>"
          FAIL_NO_ICE: "<red>Led je potreban za ovaj recept</red>"
          FAIL_NO_LAVA: "<red>Lava je potrebna za ovaj recept</red>"
          FAIL_NO_WATER: "<red>Voda je potrebna za ovaj recept</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Nije pronađen recept koji odgovara ovom stakleniku</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Potrebno je više blokova za izradu ovog recepta!</red>"
          FAIL_OVERLAPPING: "<red>Žao nam je, staklenici ne mogu dijeliti zidove.</red>"
        success: "<dark_green>Uspješno ste stvorili staklenik bioma [biome]! Biom će se sinkronizirati pri sljedećoj teleportaciji ili prijavi.</dark_green>"
        missing-blocks: "<red>Nedostaje [material] x [number]</red>"
        unknown-recipe: "<red>Nepoznat recept</red>"
        try-these: "<red>Pokušajte jedan od ovih:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Kako izgraditi staklenik]</green>"
        instructions: |
          <yellow>Napravite kutiju od stakla s 4 zida i ravnim staklenim</yellow>
          <yellow>krovom te dodajte do </yellow><white>4 vrata </white><yellow>u zidove.</yellow>
