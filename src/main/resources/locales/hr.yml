            <red>Postoji rupa u krovu ili krov nije ravan!</red>
            <red>Crveni stakleni blokovi trebali bi pokazati problem.</red>
            <red>Provjerite jeste li unutar staklenika prilikom izrade.</red>
          FAIL_HOLE_IN_WALL: "<red>Postoji rupa u zidu!</red>"
          FAIL_NO_ROOF: "<red>Čini se da nema krova! Provjerite jeste li unutar staklenika.</red>"
