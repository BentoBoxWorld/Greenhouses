            <red>Er zit een gat in het dak of het dak is niet plat!</red>
            <red>Rode glasblokken tonen het probleem.</red>
            <red>Zorg dat je in de kas staat tijdens het maken.</red>
          FAIL_HOLE_IN_WALL: "<red>Er zit een gat in de muur!</red>"
          FAIL_NO_ROOF: "<red>Er lijkt geen dak te zijn! Zorg dat je in de kas staat.</red>"
          FAIL_TOO_MANY_DOORS: "<red>Je mag niet meer dan 4 deuren in de kas hebben!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Slechts één hopper is toegestaan in de muren of het dak.</red>"
          FAIL_UNEVEN_WALLS: "<red>De muren zijn ongelijk. Rode glasblokken tonen de problematische blokken.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Onvoldoende ijs om dit recept te maken</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Onvoldoende lava om dit recept te maken</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Onvoldoende water om dit recept te maken</red>"
          FAIL_NO_ICE: "<red>Ijs is vereist om dit recept te maken</red>"
          FAIL_NO_LAVA: "<red>Lava is vereist om dit recept te maken</red>"
          FAIL_NO_WATER: "<red>Water is vereist om dit recept te maken</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Geen passend recept gevonden voor deze kas</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Meer blokken zijn vereist om dit recept te maken!</red>"
          FAIL_OVERLAPPING: "<red>Sorry, kassen mogen geen muren delen.</red>"
        success: "<dark_green>Je hebt met succes een [biome] biome kas gemaakt! De biome wordt gesynchroniseerd bij de volgende teleport of login.</dark_green>"
        missing-blocks: "<red>Ontbrekend: [material] x [number]</red>"
        unknown-recipe: "<red>Onbekend recept</red>"
        try-these: "<red>Probeer een van deze:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Hoe bouw je een kas]</green>"
        instructions: |
          <yellow>Maak een doos van glas met 4 muren en een plat glazen</yellow>
          <yellow>dak, en voeg tot </yellow><white>4 deuren </white><yellow>toe in de muren.</yellow>
          <yellow>Plaats </yellow><white>1 hopper </white><yellow>in een muur of het dak en voeg emmers</yellow>
          <yellow>water toe om automatisch sneeuw en/of bone meal te maken</yellow>
          <yellow>om planten te laten groeien. Bekijk de biome recepten om</yellow>
          <yellow>te zien welke blokken er in een kas moeten staan.</yellow>

