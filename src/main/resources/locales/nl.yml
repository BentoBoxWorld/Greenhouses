        description: "Probeer een kas te maken"
        parameters: "<recept>"
        error:
          already: "<red>Er is hier al een kas!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>Het dak bevat niet-toegestane blokken!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>De muur bevat niet-toegestane blokken!</red>"
          FAIL_BELOW: "<red>Je moet je in de kas bevinden om deze te kunnen maken</red>"
