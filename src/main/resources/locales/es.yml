     <yellow>Coloca </yellow><white>1 tolva </white><yellow>en una pared o techo y añade cubos de agua.</yellow>
     <yellow>para crear nieve y/o polvo de hueso para cultivar plantas automáticamente.</yellow>
     <yellow>Consulta las recetas de biomas para ver qué bloques deben estar dentro</yellow>
     <yellow>de un invernadero para crearlo con éxito. </yellow>
