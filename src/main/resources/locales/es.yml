      name: Invernaderos
      description: |
        <aqua>Alterna quién puede</aqua>
        <aqua>controlar los invernaderos   </aqua>

greenhouses:
  general:
   greenhouses: "Invernaderos"
   
  errors:
    move: "Primero muévete a un invernadero que te pertenezca."
    no-rank: "<red>No tienes el rango necesario para hacer eso.</red>"
    notyours: "¡Este no es tu invernadero!"
    not-inside: "<red>¡No estás dentro de un invernadero!</red>"
    tooexpensive: "No puedes permitirte [price]" 
    alreadyexists: "¡El invernadero ya existe!"
    norecipe: "¡No se puede crear el invernadero!"
    
  event:
   broke: "¡Has roto este invernadero! Revirtiendo el bioma a [biome]!"
   entering: "Entrando al invernadero [biome]<white></white>"
   leaving: "Saliendo del invernadero [biome]<white></white>"
   
  recipe:
   watermustbe: "Agua > [coverage]% del área del suelo."
   icemustbe: "Bloques de hielo > [coverage]% del área del suelo."
   lavamustbe: "Lava > [coverage]% del área del suelo."
   minimumblockstitle: "[Bloques mínimos requeridos]"
   nootherblocks: "No se requieren otros bloques."
   missing: "Falta el invernadero"
   
  commands:
    user:
      description: "Abre la interfaz de selección de invernaderos"
      remove:
        description: "Elimina el invernadero en el que estás si eres el dueño"        
      make:
        description: "Intenta crear un invernadero"
        parameters: "<receta>"
        error:
          already: "<red>¡Ya hay un invernadero aquí!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>¡El techo contiene bloques no permitidos!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>¡La pared contiene bloques no permitidos!</red>"
          FAIL_BELOW: "<red>Debes estar dentro del invernadero para intentar crearlo</red>"
          FAIL_BLOCKS_ABOVE: "<red>¡No puede haber bloques sobre el invernadero! Los bloques de cristal rojo deberían mostrar los bloques problemáticos.</red>"
          FAIL_HOLE_IN_ROOF: |
            <red>¡Hay un agujero en el techo o no es plano!</red>
            <red>Los bloques de cristal rojo deberían mostrar el problema.</red>
            <red>Asegúrate de estar dentro de tu invernadero para crearlo.</red>
          FAIL_HOLE_IN_WALL: "<red>¡Hay un agujero en la pared!</red>"
          FAIL_NO_ROOF: "<red>¡Parece que no hay techo! Asegúrate de estar dentro del invernadero para crearlo.</red>"
          FAIL_TOO_MANY_DOORS: "<red>¡No puedes tener más de 4 puertas en el invernadero!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Solo se permite una tolva en las paredes o el techo.</red>"
          FAIL_UNEVEN_WALLS: "<red>Las paredes están desiguales. Los bloques de cristal rojo deberían mostrar los bloques problemáticos.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Hielo insuficiente para crear esta receta</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Lava insuficiente para crear esta receta</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Agua insuficiente para crear esta receta</red>"
          FAIL_NO_ICE: "<red>Se requiere hielo para crear esta receta</red>"
          FAIL_NO_LAVA: "<red>Se requiere lava para crear esta receta</red>"
          FAIL_NO_WATER: "<red>Se requiere agua para crear esta receta</red>"
          FAIL_NO_RECIPE_FOUND: "<red>No se encontró ninguna receta que coincida con este invernadero</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>¡Se requieren más bloques para crear esta receta!</red>"
          FAIL_OVERLAPPING: "<red>Lo sentimos, los invernaderos no pueden compartir paredes.</red>"
        success: "<dark_green>¡Has creado con éxito un invernadero de bioma [biome]! El bioma se sincronizará en el próximo teletransporte o inicio de sesión.</dark_green>"
        missing-blocks: "<red>Falta [material] x [number]</red>"
        unknown-recipe: "<red>Receta desconocida</red>"
        try-these: "<red>Prueba una de estas:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Cómo construir un invernadero]</green>"
        instructions: |
          <yellow>Crea una caja de cristal con 4 paredes y un techo de cristal</yellow>
          <yellow>plano, y añade hasta </yellow><white>4 puertas </white><yellow>en las paredes.</yellow>
          <yellow>Coloca </yellow><white>1 tolva </white><yellow>en una pared o techo y añade cubos de agua.</yellow>
          <yellow>para crear nieve y/o polvo de hueso para cultivar plantas automáticamente.</yellow>
          <yellow>Consulta las recetas de biomas para ver qué bloques deben estar dentro</yellow>
          <yellow>de un invernadero para crearlo con éxito.</yellow>

