        description: "Показує повну інформацію про теплицю"
        parameters: "[id]"
        title: "<green>[Інформація про теплицю]</green>"
        id: "<gray>ID: </gray><white>[id]</white>"
        recipe: "<gray>Рецепт: </gray><white>[recipe]</white>"
        owner: "<gray>Власник: </gray><white>[owner]</white>"
        world: "<gray>Світ: </gray><white>[world]</white>"
        location: "<gray>Розташування: </gray><white>[xyz]</white>"
        bounding-box: "<gray>Обмежувальний прямокутник: </gray><white>[min] </white><gray>до </gray><white>[max]</white>"
        area: "<gray>Внутрішня площа: </gray><white>[area] блоків</white>"
        original-biome: "<gray>Оригінальний біом: </gray><white>[biome]</white>"
        hopper: "<gray>Воронка: </gray><white>[hopper]</white>"
        broken: "<gray>Зламана: </gray><white>[broken]</white>"
        not-loaded: "<red>Не завантажена: [reason]</red>"
