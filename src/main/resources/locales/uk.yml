        description: "Будує тестову теплицю для рецепту навколо вас або в центрі підлоги"
        parameters: "<recipe> [<x> <y> <z>] [<width>x<depth>x<height>] [keep|clear]"
        bad-coordinates: "<red>Координати потребують усіх трьох x, y та z, як цифри або ~ (наприклад ~ ~ ~ або ~ ~-1 ~5).</red>"
        bad-argument: "<red>[description] не є розміром (наприклад 9x9 або 9x9x5) або режимом (keep або clear).</red>"
        too-small: "<red>Рецепт не підходить в [size]: [description]. Спробуйте більший розмір або залишіть його для автоматичного розміру.</red>"
        out-of-world: "<red>Це вийде вище або нижче світу. Виберіть іншу висоту.</red>"
        not-on-island: "<red>Вся теплиця повинна бути на одному острові.</red>"
        overlapping: "<red>Це перекриватиме теплицю [id].</red>"
        confirm-clear: "<red>Все всередині [size] теплиці тут буде замінено.</red>"
        built: "<green>Побудована [size] [recipe] тестова теплиця ([number] блоків). Створення зараз...</green>"
      edit:
        description: "Відкриває редактор рецептів або редактор рецепту"
        parameters: "[recipe]"
