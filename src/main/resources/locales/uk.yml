        description: "Видаляє запис теплиці за ID, завантажена чи ні"
        parameters: "<id>"
        confirm: "<red>Видалити теплицю [id], якій належить до [owner] у [xyz]? Це не може бути скасовано.</red>"
        success: "<green>Теплиця [id] видалена.</green>"
      tp:
        description: "Телепортує вас до теплиці"
        parameters: "<id>"
        success: "<green>Телепортовані до теплиці [id]</green>"
      verify:
        description: "Перевіряє теплиці на відповідність їхньому рецепту"
        parameters: "[id]"
        checking: "<gray>Перевірка [number] теплиці(ь)...</gray>"
        ok: "<green>[id] у [xyz] відповідає її рецепту</green>"
        broken: "<red>[id] у [xyz] не відповідає: [reasons]</red>"
      reload:
        description: "Перезавантажує biomes.yml та перечитує теплиці з бази даних"
