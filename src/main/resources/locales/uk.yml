            <red>У даху є отвір або він не плоский!</red>
            <red>Червоні скляні блоки покажуть проблему.</red>
            <red>Переконайтеся, що ви всередині теплиці під час створення.</red>
          FAIL_HOLE_IN_WALL: "<red>У стіні є отвір!</red>"
          FAIL_NO_ROOF: "<red>Здається, даху немає! Переконайтеся, що ви всередині теплиці.</red>"
          FAIL_TOO_MANY_DOORS: "<red>Ви не можете мати більше 4 дверей у теплиці!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>У стінах або даху дозволено лише одну воронку.</red>"
          FAIL_UNEVEN_WALLS: "<red>Стіни нерівні. Червоні скляні блоки покажуть проблемні блоки.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Недостатньо льоду для цього рецепта</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Недостатньо лави для цього рецепта</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Недостатньо води для цього рецепта</red>"
          FAIL_NO_ICE: "<red>Для цього рецепта потрібен лід</red>"
          FAIL_NO_LAVA: "<red>Для цього рецепта потрібна лава</red>"
          FAIL_NO_WATER: "<red>Для цього рецепта потрібна вода</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Не знайдено рецепта, що відповідає цій теплиці</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Для цього рецепта потрібно більше блоків!</red>"
          FAIL_OVERLAPPING: "<red>На жаль, теплиці не можуть мати спільні стіни.</red>"
        success: "<dark_green>Ви успішно створили теплицю біома [biome]! Біом синхронізується при наступній телепортації або вході.</dark_green>"
        missing-blocks: "<red>Відсутній [material] x [number]</red>"
        unknown-recipe: "<red>Невідомий рецепт</red>"
        try-these: "<red>Спробуйте один із цих:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Як побудувати теплицю]</green>"
        instructions: |
          <yellow>Зробіть коробку зі скла з 4 стінами та плоским</yellow>
          <yellow>скляним дахом і додайте до </yellow><white>4 дверей </white><yellow>у стінах.</yellow>
          <yellow>Встановіть </yellow><white>1 воронку </white><yellow>у стіну або дах і додайте відра</yellow>
          <yellow>з водою, щоб автоматично створювати сніг та/або кісткове</yellow>
          <yellow>борошно для росту рослин. Перевірте рецепти біомів, щоб</yellow>
          <yellow>дізнатися, які блоки повинні бути всередині для успіху.</yellow>
    admin:
      description: "Команди адміністратора теплиць"
      errors:
        unknown-id: "<red>Теплиця з ID [id] не знайдена. Використовуйте команду list для перегляду ID. Часткова ID працює, якщо вона відповідає лише одній теплиці.</red>"
