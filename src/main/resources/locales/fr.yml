   nootherblocks: "Aucun autre bloc requis."
   missing: "La serre est manquante"
   
  commands:
    user:
      description: "Ouvre l'interface de sélection des serres"
      remove:
        description: "Supprime la serre dans laquelle vous vous trouvez si vous en êtes le propriétaire"        
      make:
        description: "Tenter de créer une serre"
        parameters: "<recette>"
        error:
          already: "<red>Il y a déjà une serre ici !</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>Le toit contient des blocs non autorisés !</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>Le mur contient des blocs non autorisés !</red>"
          FAIL_BELOW: "<red>Vous devez être à l'intérieur de la serre pour essayer de la créer</red>"
          FAIL_BLOCKS_ABOVE: "<red>Il ne peut y avoir aucun bloc au-dessus de la serre ! Des blocs de verre rouge devraient indiquer les blocs problématiques.</red>"
          FAIL_HOLE_IN_ROOF: |
            <red>Il y a un trou dans le toit ou il n'est pas plat !</red>
            <red>Des blocs de verre rouge devraient indiquer le problème.</red>
            <red>Assurez-vous d'être à l'intérieur de votre serre pour la créer.</red>
          FAIL_HOLE_IN_WALL: "<red>Il y a un trou dans le mur !</red>"
          FAIL_NO_ROOF: "<red>Il semble ne pas y avoir de toit ! Assurez-vous d'être à l'intérieur de la serre pour la créer.</red>"
          FAIL_TOO_MANY_DOORS: "<red>Vous ne pouvez pas avoir plus de 4 portes dans la serre !</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Un seul entonnoir est autorisé dans les murs ou le toit.</red>"
          FAIL_UNEVEN_WALLS: "<red>Les murs sont inégaux. Des blocs de verre rouge devraient indiquer les blocs problématiques.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Glace insuffisante pour réaliser cette recette</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Lave insuffisante pour réaliser cette recette</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Eau insuffisante pour réaliser cette recette</red>"
          FAIL_NO_ICE: "<red>De la glace est requise pour cette recette</red>"
          FAIL_NO_LAVA: "<red>De la lave est requise pour cette recette</red>"
          FAIL_NO_WATER: "<red>De l'eau est requise pour cette recette</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Aucune recette correspondante à cette serre n'a été trouvée</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Plus de blocs sont requis pour réaliser cette recette !</red>"
          FAIL_OVERLAPPING: "<red>Désolé, les serres ne peuvent pas partager de murs.</red>"
        success: "<dark_green>Vous avez créé avec succès une serre de biome [biome] ! Le biome se synchronisera lors de votre prochaine téléportation ou connexion.</dark_green>"
        missing-blocks: "<red>Manquant : [material] x [number]</red>"
        unknown-recipe: "<red>Recette inconnue</red>"
        try-these: "<red>Essayez l'une de celles-ci :</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Comment construire une serre]</green>"
        instructions: |
          <yellow>Fabriquez une boîte en verre avec 4 murs et un toit en verre</yellow>
          <yellow>plat, puis ajoutez jusqu'à </yellow><white>4 portes </white><yellow>dans les murs.</yellow>
          <yellow>Placez </yellow><white>1 entonnoir </white><yellow>dans un mur ou le toit et ajoutez des seaux d'eau</yellow>
          <yellow>pour créer de la neige et/ou de la poudre d'os pour faire pousser les plantes automatiquement.</yellow>
          <yellow>Consultez les recettes de biome pour savoir quels blocs doivent être à l'intérieur d'une</yellow>
          <yellow>serre pour la créer avec succès.</yellow>

