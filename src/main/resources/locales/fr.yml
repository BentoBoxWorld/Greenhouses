     <yellow>pour créer de la neige et/ou de la poudre d'os pour faire pousser les plantes automatiquement.</yellow>
     <yellow>Consultez les recettes de biome pour savoir quels blocs doivent être à l'intérieur d'une</yellow>
     <yellow>serre pour la créer avec succès.</yellow>
