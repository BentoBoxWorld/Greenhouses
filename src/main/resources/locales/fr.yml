    notyours: "Ce n'est pas votre serre !"
    not-inside: "<red>Vous n'êtes pas à l'intérieur d'une serre !</red>"
    tooexpensive: "Vous n'avez pas les moyens [price]" 
    alreadyexists: "La serre existe déjà !"
    norecipe: "Impossible de créer une serre !"
    
  event:
   broke: "Vous avez cassé cette serre ! Retour du biome en [biome] !"
   entering: "Entrée dans la serre [biome]<white></white>"
   leaving: "Sortie de la serre [biome]<white></white>"
   
  recipe:
   watermustbe: "Eau > [coverage]% de la surface au sol."
   icemustbe: "Blocs de glace > [coverage]% de la surface au sol."
   lavamustbe: "Lave > [coverage]% de la surface au sol."
