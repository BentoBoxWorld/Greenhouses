      description: "Mở giao diện chọn Nhà kính"
      remove:
        description: "Xóa nhà kính bạn đang đứng nếu bạn là chủ sở hữu"
      make:
        description: "Thử tạo một nhà kính"
        parameters: "<recipe>"
        error:
          already: "<red>Đã có một nhà kính ở đây!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>Mái nhà chứa các khối không được phép!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>Tường chứa các khối không được phép!</red>"
          FAIL_BELOW: "<red>Bạn phải ở bên trong nhà kính để thử tạo nó</red>"
          FAIL_BLOCKS_ABOVE: "<red>Không được có khối nào phía trên nhà kính! Các khối kính đỏ sẽ hiển thị các khối gặp vấn đề.</red>"
          FAIL_HOLE_IN_ROOF: |
            <red>Có một lỗ hổng trên mái nhà hoặc nó không phẳng!</red>
            <red>Các khối kính đỏ sẽ hiển thị vấn đề.</red>
            <red>Đảm bảo bạn đang ở bên trong nhà kính để tạo nó.</red>
          FAIL_HOLE_IN_WALL: "<red>Có một lỗ hổng trên tường!</red>"
          FAIL_NO_ROOF: "<red>Dường như không có mái nhà! Đảm bảo bạn đang ở bên trong nhà kính để tạo nó.</red>"
          FAIL_TOO_MANY_DOORS: "<red>Bạn không thể có quá 4 cánh cửa trong nhà kính!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Chỉ cho phép một phễu trong tường hoặc mái nhà.</red>"
          FAIL_UNEVEN_WALLS: "<red>Các bức tường không đều nhau. Các khối kính đỏ sẽ hiển thị các khối gặp vấn đề.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Không đủ băng để thực hiện công thức này</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Không đủ nham thạch để thực hiện công thức này</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Không đủ nước để thực hiện công thức này</red>"
          FAIL_NO_ICE: "<red>Cần có băng để thực hiện công thức này</red>"
          FAIL_NO_LAVA: "<red>Cần có nham thạch để thực hiện công thức này</red>"
          FAIL_NO_WATER: "<red>Cần có nước để thực hiện công thức này</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Không tìm thấy công thức nào phù hợp với nhà kính này</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Cần thêm các khối để thực hiện công thức này!</red>"
          FAIL_OVERLAPPING: "<red>Rất tiếc, các nhà kính không thể dùng chung tường.</red>"
        success: "<dark_green>Bạn đã tạo thành công nhà kính sinh thái [biome]! Hệ sinh thái sẽ đồng bộ hóa ở lần dịch chuyển hoặc đăng nhập tiếp theo.</dark_green>"
        missing-blocks: "<red>Thiếu [material] x [number]</red>"
        unknown-recipe: "<red>Công thức không xác định</red>"
        try-these: "<red>Hãy thử một trong những cách sau:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Cách xây dựng nhà kính]</green>"
        instructions: |
          <yellow>Làm một chiếc hộp bằng kính với 4 bức tường và mái kính phẳng,</yellow>
          <yellow>thêm tối đa </yellow><white>4 cánh cửa </white><yellow>ở các bức tường.</yellow>
          <yellow>Đặt </yellow><white>1 cái phễu </white><yellow>vào tường hoặc mái nhà và thêm các xô nước.</yellow>
          <yellow>để tạo tuyết và/hoặc bột xương giúp cây trồng tự động phát triển.</yellow>
          <yellow>Kiểm tra các công thức sinh thái để biết những khối nào phải có bên trong</yellow>
          <yellow>nhà kính để tạo thành công.</yellow>
      help:
        help: "trợ giúp"
        make: "thử tạo một nhà kính"
        remove: "xóa nhà kính bạn đang đứng nếu bạn sở hữu nó"
        list: "liệt kê các công thức nhà kính"

