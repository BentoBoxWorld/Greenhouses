          <yellow>並在牆上添加最多 </yellow><white>4 扇門</white><yellow>。</yellow>
          <yellow>在牆壁或屋頂放置 </yellow><white>1 個漏斗</white><yellow>，並添加水桶以</yellow>
          <yellow>自動生成積雪和/或骨粉，讓植物自動生長。</yellow>
          <yellow>請查看生物群系食譜，了解內部必須放置哪些方塊</yellow>
          <yellow>才能成功創建。</yellow>

