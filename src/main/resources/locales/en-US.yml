###########################################################################################
# This is a YML file. Be careful when editing. Check your edits in a YAML checker like    #
# the one at http://yaml-online-parser.appspot.com                                        #
# If this file is deleted, then it will be recreate at the next reload.                   #
###########################################################################################
protection:
  flags:
    GREENHOUSE:
      name: Greenhouses
      description: |
        <aqua>Toggle who can</aqua>
        <aqua>control greenhouses   </aqua>

greenhouses:
  general:
   greenhouses: "Greenhouses"
   
  errors:
    move: "Move to a greenhouse you own first."
    no-rank: "<red>You do not have rank to do that.</red>"
    notyours: "This is not your greenhouse!"
    not-inside: "<red>You are not in a greenhouse!</red>"
    tooexpensive: "You cannot afford [price]" 
    alreadyexists: "Greenhouse already exists!"
    norecipe: "Cannot make a greenhouse!"
    
  event:
   broke: "You broke this greenhouse! Reverting biome to [biome]!"
   entering: "Entering [biome]  greenhouse"
   leaving: "Leaving [biome]  greenhouse"
   
  # Recipe tooltips in the greenhouse panel
  recipe:
   # Each line of the recipe's description; [text] is one word-wrapped line of it
   description: "<gray>[text]</gray>"
   minimumblockstitle: "<yellow>Needs at least:</yellow>"
   # [block] is a required block and how many, e.g. "Sand x 1"
   block: "<white> • [block]</white>"
   watermustbe: "<aqua>Water over [coverage]% of the floor</aqua>"
   icemustbe: "<aqua>Ice over [coverage]% of the floor</aqua>"
   lavamustbe: "<gold>Lava over [coverage]% of the floor</gold>"
   nootherblocks: "<white>No other blocks needed</white>"
   missing: "Greenhouse is missing"
   
  commands:
    user:
      description: "Opens the Greenhouse selection GUI"
      remove:
        description: "Removes a greenhouse that you are standing in if you are the owner"        
      make:
        description: "Try to make a greenhouse"
        parameters: "<recipe>"
        error:
          already: "<red>There is already a greenhouse here!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>Roof contains disallowed blocks!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>Wall contains disallowed blocks!</red>"
          FAIL_BELOW: "<red>You must be inside the greenhouse to try to make it</red>"
          FAIL_BLOCKS_ABOVE: "<red>There can be no blocks above the greenhouse! Red glass blocks should show the problem blocks.</red>"
          FAIL_HOLE_IN_ROOF: |
            <red>There is a hole in the roof or it is not flat!</red>
            <red>Red glass blocks should show the problem.</red>
            <red>Make sure you are inside your greenhouse to make it.</red>
          FAIL_HOLE_IN_WALL: "<red>There is a hole in the wall!</red>"
          FAIL_NO_ROOF: "<red>There seems to be no roof! Make sure you are inside the greenhouse to make it.</red>"
          FAIL_TOO_MANY_DOORS: "<red>You cannot have more than 4 doors in the greenhouse!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Only one hopper is allowed in the walls or roof.</red>"
          FAIL_UNEVEN_WALLS: "<red>The walls are uneven. Red glass blocks should show the problem blocks.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Insufficient ice to make this recipe</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Insufficient lava to make this recipe</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Insufficient water to make this recipe</red>"
          FAIL_NO_ICE: "<red>Ice is required to make this recipe</red>"
          FAIL_NO_LAVA: "<red>Lava is required to make this recipe</red>"
          FAIL_NO_WATER: "<red>Water is required to make this recipe</red>"
          FAIL_NO_RECIPE_FOUND: "<red>No recipe could be found that matches this greenhouse</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>More blocks are required to make this recipe!</red>"
          FAIL_OVERLAPPING: "<red>Greenhouses cannot share walls, sorry.</red>"
        success: "<dark_green>You successfully made a [biome]</dark_green><dark_green>  biome greenhouse! Biome will sync at next teleport or login.</dark_green>"
        missing-blocks: "<red>Missing [material] x [number]</red>"
        unknown-recipe: "<red>Unknown recipe</red>"
        try-these: "<red>Try one of these:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[How To Build A Greenhouse]</green>"
        instructions: |
          <yellow>Make a box out of out of glass with 4 walls and a flat glass</yellow>
          <yellow>roof and add up to </yellow><white>4 doors </white><yellow>in the walls.</yellow>
          <yellow>Place </yellow><white>1 hopper </white><yellow>in a wall or roof and add water buckets.</yellow>
          <yellow>to make snow and/or bonemeal to grow plants automatically.</yellow>
          <yellow>Check the biome recipes for what blocks must be inside a</yellow>
          <yellow>greenhouse to make one successfully. </yellow>
    admin:
      description: "Greenhouses admin commands"
      errors:
        unknown-id: "<red>No greenhouse found with ID [id]. Use the list command to see IDs. A partial ID works if it only matches one greenhouse.</red>"
        id-required: "<red>Run this from in-game inside a greenhouse, or give a greenhouse ID.</red>"
        no-location: "<red>Greenhouse [id] has no valid location or its world is not loaded.</red>"
      list:
        description: "Lists greenhouses, optionally for one player"
        parameters: "[player] [page]"
        title: "<green>[Greenhouses] </green><gray>([number] total, page [page] of [pages])</gray>"
        entry: "<gray>[id] </gray><white>[recipe] </white><gray>at </gray><white>[xyz] </white><gray>in </gray><white>[world] </white><gray>- </gray><white>[owner][broken]</white>"
        broken: " <red>(broken)</red>"
        more: "<gray>Use </gray><white>/[label] greenhouses list [page] </white><gray>for more</gray>"
        none: "<red>No greenhouses found.</red>"
        unloaded-title: "<red>[Not loaded: [number]] </red><gray>These records are in the database but are not active:</gray>"
        unloaded-entry: "<red>[id] </red><gray>[reason] </gray><gray>at </gray><white>[xyz] </white><gray>in </gray><white>[world]</white>"
      info:
        description: "Shows full detail of a greenhouse"
        parameters: "[id]"
        title: "<green>[Greenhouse Info]</green>"
        id: "<gray>ID: </gray><white>[id]</white>"
        recipe: "<gray>Recipe: </gray><white>[recipe]</white>"
        owner: "<gray>Owner: </gray><white>[owner]</white>"
        world: "<gray>World: </gray><white>[world]</white>"
        location: "<gray>Location: </gray><white>[xyz]</white>"
        bounding-box: "<gray>Bounding box: </gray><white>[min] </white><gray>to </gray><white>[max]</white>"
        area: "<gray>Internal area: </gray><white>[area] blocks</white>"
        original-biome: "<gray>Original biome: </gray><white>[biome]</white>"
        hopper: "<gray>Hopper: </gray><white>[hopper]</white>"
        broken: "<gray>Broken: </gray><white>[broken]</white>"
        not-loaded: "<red>Not loaded: [reason]</red>"
      delete:
        description: "Deletes a greenhouse record by ID, loaded or not"
        parameters: "<id>"
        confirm: "<red>Delete greenhouse [id] belonging to [owner] at [xyz]? This cannot be undone.</red>"
        success: "<green>Greenhouse [id] deleted.</green>"
      tp:
        description: "Teleports you to a greenhouse"
        parameters: "<id>"
        success: "<green>Teleported to greenhouse [id]</green>"
      verify:
        description: "Re-checks greenhouses against their recipe"
        parameters: "[id]"
        checking: "<gray>Checking [number] greenhouse(s)...</gray>"
        ok: "<green>[id] at [xyz] meets its recipe</green>"
        broken: "<red>[id] at [xyz] fails: [reasons]</red>"
      reload:
        description: "Reloads biomes.yml and re-reads greenhouses from the database"
        success: "<green>Reloaded. [number] greenhouses active.</green>"
        unloaded: "<red>[number] record(s) could not be loaded - use the list command to see them.</red>"
      build:
        description: "Builds a test greenhouse for a recipe, around you or at the given floor centre"
        parameters: "<recipe> [<x> <y> <z>] [<width>x<depth>x<height>] [keep|clear]"
        bad-coordinates: "<red>Coordinates need all three of x, y and z, as numbers or ~ (e.g. ~ ~ ~ or ~ ~-1 ~5).</red>"
        bad-argument: "<red>[description] is not a size (e.g. 9x9 or 9x9x5) or a mode (keep or clear).</red>"
        too-small: "<red>The recipe does not fit in [size]: [description]. Try a bigger size, or leave it out to size it automatically.</red>"
        out-of-world: "<red>That would go above or below the world. Pick another height.</red>"
        not-on-island: "<red>The whole greenhouse must be on one island.</red>"
        overlapping: "<red>That would overlap greenhouse [id].</red>"
        confirm-clear: "<red>Everything inside a [size] greenhouse here will be replaced.</red>"
        built: "<green>Built a [size] [recipe] test greenhouse ([number] blocks). Making it now...</green>"


