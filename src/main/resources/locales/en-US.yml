###########################################################################################
# This is a YML file. Be careful when editing. Check your edits in a YAML checker like    #
# the one at http://yaml-online-parser.appspot.com                                        #
# If this file is deleted, then it will be recreate at the next reload.                   #
###########################################################################################
protection:
  flags:
    GREENHOUSE:
      name: Greenhouses
      description: |
        <aqua>Toggle who can</aqua>
        <aqua>control greenhouses   </aqua>

greenhouses:
  general:
   greenhouses: "Greenhouses"
   
  errors:
    move: "Move to a greenhouse you own first."
    no-rank: "<red>You do not have rank to do that.</red>"
    notyours: "This is not your greenhouse!"
    not-inside: "<red>You are not in a greenhouse!</red>"
    tooexpensive: "You cannot afford [price]" 
    alreadyexists: "Greenhouse already exists!"
    norecipe: "Cannot make a greenhouse!"
    
  event:
   broke: "You broke this greenhouse! Reverting biome to [biome]!"
   entering: "Entering [biome]  greenhouse"
   leaving: "Leaving [biome]  greenhouse"
   
  # Recipe tooltips in the greenhouse panel
  recipe:
   # Each line of the recipe's description; [text] is one word-wrapped line of it
   description: "<gray>[text]</gray>"
   minimumblockstitle: "<yellow>Needs at least:</yellow>"
   # [block] is a required block and how many, e.g. "Sand x 1"
   block: "<white> • [block]</white>"
   watermustbe: "<aqua>Water over [coverage]% of the floor</aqua>"
   icemustbe: "<aqua>Ice over [coverage]% of the floor</aqua>"
   lavamustbe: "<gold>Lava over [coverage]% of the floor</gold>"
   nootherblocks: "<white>No other blocks needed</white>"
   missing: "Greenhouse is missing"
   
  # The admin hub: /<gamemode>admin greenhouses with no arguments
  hub:
    title: "<dark_green>Greenhouses admin</dark_green>"
    close: "<white>Close</white>"
    back: "<white>Back</white>"
    cancel: "Cancel"
    recipes:
      name: "<green>Recipes</green>"
      description: "<gray>Edit, add or delete the [number] greenhouse recipes</gray>"
    greenhouses:
      name: "<green>Greenhouses</green>"
      description: "<gray>[number] greenhouse(s) built. Teleport to, check, inspect or delete them.</gray>"
      unloaded: "<red>[number] could not be loaded</red>"
    build:
      name: "<green>Build a test greenhouse</green>"
      description: "<gray>Builds a working greenhouse for a recipe where you stand, with its door on the side you face</gray>"
      pick-title: "<dark_green>Build which recipe?</dark_green>"
      key: "<gray>Key: <white>[key]</white></gray>"
      default-size: "<gray>Default size: <white>[size]</white></gray>"
      click: "<yellow>Click to choose the size</yellow>"
      title: "Build [name]"
      body: "The greenhouse is built with its floor centre where you stand and its door on the side you face. Sizes are the inside."
      width: "Width"
      depth: "Depth"
      height: "Height"
      mode: "What is already there"
      keep: "Keep it and build around it"
      clear: "Clear it away first"
      go: "<green>Build</green>"
    verify:
      name: "<green>Check all greenhouses</green>"
      description: "<gray>Checks every greenhouse against its recipe now and reports in chat</gray>"
    reload:
      name: "<green>Reload</green>"
      description: "<gray>Re-reads biomes.yml and the greenhouses database</gray>"
      confirm-title: "Reload?"
      confirm-body: "Re-read biomes.yml and the greenhouses database? Unsaved recipe edits are kept, but will need saving over the reloaded recipes."
      confirm: "<yellow>Reload</yellow>"

  # The admin greenhouse browser, from the hub
  browser:
    title: "<dark_green>Greenhouses</dark_green>"
    title-owner: "<dark_green>Greenhouses</dark_green> <dark_gray>-</dark_gray> [owner]"
    none: "<gray>No greenhouses</gray>"
    back: "<white>Back</white>"
    cancel: "Cancel"
    id: "<gray>ID: <white>[id]</white></gray>"
    owner: "<gray>Owner: <white>[owner]</white></gray>"
    where: "<gray>At: <white>[xyz]</white> in <white>[world]</white></gray>"
    ok: "<green>Working</green>"
    broken: "<red>Broken</red>"
    unloaded: "<red>Not loaded: [reason]</red>"
    click:
      tp: "<yellow>Left-click: teleport there</yellow>"
      verify: "<yellow>Right-click: check it now</yellow>"
      info: "<yellow>Shift-click: details in chat</yellow>"
      delete: "<yellow>Q: delete</yellow>"
    filter:
      name: "<white>Filter by owner</white>"
      all: "<gray>Showing everyone's</gray>"
      only: "<gray>Showing <white>[owner]</white>'s</gray>"
      click: "<yellow>Click to change</yellow>"
      title: "Filter by owner"
      label: "Owner's name (blank for everyone)"
      apply: "<green>Show</green>"
    delete:
      title: "Delete greenhouse?"
      body: "Delete greenhouse [id] belonging to [owner] at [xyz]? This cannot be undone."
      confirm: "<red>Delete</red>"

  # The admin recipe editor: /<gamemode>admin greenhouses edit
  editor:
    needs-dialogs: "<red>The recipe editor needs Paper 1.21.7 or later.</red>"
    unknown-recipe: "<red>There is no recipe called [key].</red>"
    resuming: "<yellow>Picking up your unsaved changes to [name]<yellow>.</yellow>"
    saved: "<green>Saved [name]<green>. [number] greenhouse(s) use it and follow the new rules from now on.</green>"
    save-failed: "<red>biomes.yml could not be written - see the server log. Nothing was saved.</red>"
    deleted: "<green>Deleted [name]<green>. Its [number] greenhouse(s) are listed as unloaded until deleted or the recipe comes back.</green>"
    title: "<dark_green>Editing</dark_green> [name][unsaved]"
    unsaved-mark: " <gold>(unsaved)</gold>"
    list-title: "[what] <dark_gray>-</dark_gray> [name]"
    click-change: "<yellow>Click to change</yellow>"
    click-open: "<yellow>Click to open</yellow>"
    none: "none"
    entries: "<gray>Entries: <white>[number]</white></gray>"
    total-chance: "<gray>Chances add up to <white>[value]%</white></gray>"
    chance: "<gray>Chance: <white>[value]%</white></gray>"
    back-to-recipe: "<white>Back to the recipe</white>"
    help: "<white>How to use this page</white>"
    list:
      title: "<dark_green>Greenhouse recipes</dark_green>"
      key: "<gray>Key: <white>[key]</white></gray>"
      biome: "<gray>Biome: <white>[biome]</white></gray>"
      priority: "<gray>Priority: <white>[number]</white></gray>"
      used: "<gray>Used by <white>[number]</white> greenhouse(s)</gray>"
      unsaved: "<gold>You have unsaved changes</gold>"
      click-edit: "<yellow>Click to edit</yellow>"
      back: "<white>Back</white>"
      new:
        name: "<green>New recipe</green>"
        description: "<gray>Start a recipe from scratch</gray>"
    pick:
      biome: "<dark_green>Choose a biome</dark_green>"
      icon: "<dark_green>Choose an icon</dark_green>"
      block: "<dark_green>Choose a block</dark_green>"
      plant: "<dark_green>Choose a plant</dark_green>"
      grows-on: "<dark_green>What does it grow on?</dark_green>"
      mob: "<dark_green>Choose a mob</dark_green>"
      spawns-on: "<dark_green>What does it spawn on?</dark_green>"
      convert-from: "<dark_green>Which block changes?</dark_green>"
      convert-to: "<dark_green>What does it change into?</dark_green>"
      next-to: "<dark_green>What must it be next to?</dark_green>"
    icon:
      name: "<white>Icon</white>"
    general:
      name: "<white>Name and description</white>"
      value-name: "<gray>Name: </gray>[value]"
      value-priority: "<gray>Priority: <white>[number]</white></gray>"
      value-permission: "<gray>Permission: <white>[value]</white></gray>"
      no-description: "<gray>No description</gray>"
      has-description: "<gray>Has a description</gray>"
    biome:
      name: "<white>Biome</white>"
      value: "<gray>Biome: <white>[biome]</white></gray>"
    coverage:
      name: "<white>Water, lava and ice</white>"
      water: "<aqua>Water: </aqua>[value]"
      lava: "<gold>Lava: </gold>[value]"
      ice: "<aqua>Ice: </aqua>[value]"
      unchecked: "<gray>not checked</gray>"
      none: "<red>none allowed</red>"
      at-least: "<white>at least [number]% of the floor</white>"
    mob-limits:
      name: "<white>Mob limits</white>"
      ground: "<gray>Blocks per mob: <white>[number]</white></gray>"
      water: "<gray>Water blocks per water mob: <white>[value]</white></gray>"
      lava: "<gray>Lava blocks per lava mob: <white>[value]</white></gray>"
      air: "<gray>Air blocks per flying mob: <white>[value]</white></gray>"
      shared: "same as ground"
      max: "<gray>Most mobs at once: <white>[value]</white></gray>"
      no-max: "no limit"
    blocks:
      name: "<white>Required blocks</white>"
      add: "<green>Add a block</green>"
      help: "<gray>The least of each block the greenhouse must have inside.</gray>"
      entry: "<white>[block] x [number]</white>"
      entry-help: "<yellow>Left-click: +1<newline>Right-click: -1<newline>Shift-click: type a number<newline>Q: remove</yellow>"
    plants:
      name: "<white>Plants</white>"
      add: "<green>Add a plant</green>"
      help: "<gray>Plants grown with bone meal from the roof hopper.</gray>"
      grows-on: "<gray>Grows on: <white>[block]</white></gray>"
      entry-help: "<yellow>Left-click: chance<newline>Right-click: what it grows on<newline>Q: remove</yellow>"
    mobs:
      name: "<white>Mobs</white>"
      add: "<green>Add a mob</green>"
      help: "<gray>Mobs that spawn in the greenhouse.</gray>"
      spawns-on: "<gray>Spawns on: <white>[block]</white></gray>"
      variant: "<gray>Variant: <white>[value]</white></gray>"
      entry-help: "<yellow>Left-click: chance and variant<newline>Right-click: what it spawns on<newline>Q: remove</yellow>"
    conversions:
      name: "<white>Block conversions</white>"
      add: "<green>Add a conversion</green>"
      help: "<gray>Blocks that slowly change into other blocks.</gray>"
      to: "<gray>Becomes: <white>[block]</white></gray>"
      anywhere: "<gray>Anywhere</gray>"
      next-to: "<gray>Only next to: <white>[block]</white></gray>"
      entry-help: "<yellow>Left-click: chance<newline>Right-click: what it becomes<newline>Shift-right: only next to a block<newline>Shift-left: anywhere<newline>Q: remove</yellow>"
    back:
      name: "<white>Back to recipes</white>"
      description: "<gray>Unsaved changes are kept</gray>"
    discard:
      name: "<red>Discard changes</red>"
      description: "<gray>Forget changes since the last save</gray>"
    save:
      name: "<green>Save</green>"
      nothing: "<gray>No changes to save</gray>"
      description: "<gray>Writes biomes.yml; [number] greenhouse(s) follow the new rules at once</gray>"
      problems: "<red>Fix these first:</red>"
      problem: "<red> - [problem]</red>"
    duplicate:
      name: "<white>Duplicate</white>"
      description: "<gray>Start a new recipe from this one</gray>"
    delete:
      name: "<red>Delete recipe</red>"
      description: "<gray>[number] greenhouse(s) use this recipe</gray>"
    dialog:
      cancel: "Cancel"
      switch:
        title: "Unsaved changes"
        body: "You have unsaved changes to [name]. Discard them to edit this recipe?"
        discard: "<red>Discard them</red>"
        keep: "Back to [name]"
      discard:
        title: "Discard changes?"
        body: "Forget your changes to [name]?"
        confirm: "<red>Discard</red>"
      conflict:
        title: "Changed by someone else"
        body: "[name] was saved by someone else, or reloaded, after you started editing it."
        overwrite: "<red>Save mine over it</red>"
        theirs: "Start again from theirs"
      delete:
        title: "Delete recipe?"
        body: "Delete [name]? [number] greenhouse(s) use it. biomes.yml is backed up first."
        confirm: "<red>Delete</red>"
    form:
      ok: "<green>Done</green>"
      cancel: "Cancel"
      problem: "<red>[problem]</red>"
      bad-chance: "[what]: [value] is not a chance. Use a percentage above 0 and up to 100, e.g. 5 or 0.5."
      general:
        title: "Name and description"
        name: "Name (MiniMessage colors allowed)"
        description: "Description shown in the recipe panel"
        priority: "Priority"
        permission: "Permission needed to make it (blank for none)"
        no-name: "The name cannot be blank."
        bad-permission: "A permission cannot contain spaces."
      coverage:
        title: "Water, lava and ice"
        water: "Water"
        lava: "Lava"
        ice: "Ice"
        percent: "Percent of the floor"
        unchecked: "Not checked"
        none: "None allowed"
        atleast: "At least..."
        too-much: "Water, lava and ice together cannot need more than the whole floor."
      mobs:
        title: "Mob limits"
        ground: "Blocks per mob"
        water: "Water blocks per water mob (0 = same)"
        lava: "Lava blocks per lava mob (0 = same)"
        air: "Air blocks per flying mob (0 = same)"
        max: "Most mobs at once (-1 = no limit)"
      chance:
        title: "Chance"
        field: "% chance for [what]"
      mob:
        title: "Mob"
        variant: "Variant"
        no-variant: "Normal"
      count:
        title: "How many?"
        field: "How many [what]"
      key:
        title: "Recipe key"
        field: "Key: letters, numbers, - and _ (cannot be changed later)"
        bad: "Use 1 to 32 letters, numbers, - or _."
        taken: "There is already a recipe called [key]."
  commands:
    user:
      description: "Opens the Greenhouse selection GUI"
      remove:
        description: "Removes a greenhouse that you are standing in if you are the owner"        
      make:
        description: "Try to make a greenhouse"
        parameters: "<recipe>"
        error:
          already: "<red>There is already a greenhouse here!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>Roof contains disallowed blocks!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>Wall contains disallowed blocks!</red>"
          FAIL_BELOW: "<red>You must be inside the greenhouse to try to make it</red>"
          FAIL_BLOCKS_ABOVE: "<red>There can be no blocks above the greenhouse! Red glass blocks should show the problem blocks.</red>"
          FAIL_HOLE_IN_ROOF: |
            <red>There is a hole in the roof or it is not flat!</red>
            <red>Red glass blocks should show the problem.</red>
            <red>Make sure you are inside your greenhouse to make it.</red>
          FAIL_HOLE_IN_WALL: "<red>There is a hole in the wall!</red>"
          FAIL_NO_ROOF: "<red>There seems to be no roof! Make sure you are inside the greenhouse to make it.</red>"
          FAIL_TOO_MANY_DOORS: "<red>You cannot have more than 4 doors in the greenhouse!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Only one hopper is allowed in the walls or roof.</red>"
          FAIL_UNEVEN_WALLS: "<red>The walls are uneven. Red glass blocks should show the problem blocks.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Insufficient ice to make this recipe</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Insufficient lava to make this recipe</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Insufficient water to make this recipe</red>"
          FAIL_NO_ICE: "<red>Ice is required to make this recipe</red>"
          FAIL_NO_LAVA: "<red>Lava is required to make this recipe</red>"
          FAIL_NO_WATER: "<red>Water is required to make this recipe</red>"
          FAIL_NO_RECIPE_FOUND: "<red>No recipe could be found that matches this greenhouse</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>More blocks are required to make this recipe!</red>"
          FAIL_OVERLAPPING: "<red>Greenhouses cannot share walls, sorry.</red>"
        success: "<dark_green>You successfully made a [biome]</dark_green><dark_green>  biome greenhouse! Biome will sync at next teleport or login.</dark_green>"
        missing-blocks: "<red>Missing [material] x [number]</red>"
        unknown-recipe: "<red>Unknown recipe</red>"
        try-these: "<red>Try one of these:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[How To Build A Greenhouse]</green>"
        instructions: |
          <yellow>Make a box out of out of glass with 4 walls and a flat glass</yellow>
          <yellow>roof and add up to </yellow><white>4 doors </white><yellow>in the walls.</yellow>
          <yellow>Place </yellow><white>1 hopper </white><yellow>in a wall or roof and add water buckets.</yellow>
          <yellow>to make snow and/or bonemeal to grow plants automatically.</yellow>
          <yellow>Check the biome recipes for what blocks must be inside a</yellow>
          <yellow>greenhouse to make one successfully. </yellow>
    admin:
      description: "Greenhouses admin commands"
      errors:
        unknown-id: "<red>No greenhouse found with ID [id]. Use the list command to see IDs. A partial ID works if it only matches one greenhouse.</red>"
        id-required: "<red>Run this from in-game inside a greenhouse, or give a greenhouse ID.</red>"
        no-location: "<red>Greenhouse [id] has no valid location or its world is not loaded.</red>"
      list:
        description: "Lists greenhouses, optionally for one player"
        parameters: "[player] [page]"
        title: "<green>[Greenhouses] </green><gray>([number] total, page [page] of [pages])</gray>"
        entry: "<gray>[id] </gray><white>[recipe] </white><gray>at </gray><white>[xyz] </white><gray>in </gray><white>[world] </white><gray>- </gray><white>[owner][broken]</white>"
        broken: " <red>(broken)</red>"
        more: "<gray>Use </gray><white>/[label] greenhouses list [page] </white><gray>for more</gray>"
        none: "<red>No greenhouses found.</red>"
        unloaded-title: "<red>[Not loaded: [number]] </red><gray>These records are in the database but are not active:</gray>"
        unloaded-entry: "<red>[id] </red><gray>[reason] </gray><gray>at </gray><white>[xyz] </white><gray>in </gray><white>[world]</white>"
      info:
        description: "Shows full detail of a greenhouse"
        parameters: "[id]"
        title: "<green>[Greenhouse Info]</green>"
        id: "<gray>ID: </gray><white>[id]</white>"
        recipe: "<gray>Recipe: </gray><white>[recipe]</white>"
        owner: "<gray>Owner: </gray><white>[owner]</white>"
        world: "<gray>World: </gray><white>[world]</white>"
        location: "<gray>Location: </gray><white>[xyz]</white>"
        bounding-box: "<gray>Bounding box: </gray><white>[min] </white><gray>to </gray><white>[max]</white>"
        area: "<gray>Internal area: </gray><white>[area] blocks</white>"
        original-biome: "<gray>Original biome: </gray><white>[biome]</white>"
        hopper: "<gray>Hopper: </gray><white>[hopper]</white>"
        broken: "<gray>Broken: </gray><white>[broken]</white>"
        not-loaded: "<red>Not loaded: [reason]</red>"
      delete:
        description: "Deletes a greenhouse record by ID, loaded or not"
        parameters: "<id>"
        confirm: "<red>Delete greenhouse [id] belonging to [owner] at [xyz]? This cannot be undone.</red>"
        success: "<green>Greenhouse [id] deleted.</green>"
      tp:
        description: "Teleports you to a greenhouse"
        parameters: "<id>"
        success: "<green>Teleported to greenhouse [id]</green>"
      verify:
        description: "Re-checks greenhouses against their recipe"
        parameters: "[id]"
        checking: "<gray>Checking [number] greenhouse(s)...</gray>"
        ok: "<green>[id] at [xyz] meets its recipe</green>"
        broken: "<red>[id] at [xyz] fails: [reasons]</red>"
      reload:
        description: "Reloads biomes.yml and re-reads greenhouses from the database"
        success: "<green>Reloaded. [number] greenhouses active.</green>"
        unloaded: "<red>[number] record(s) could not be loaded - use the list command to see them.</red>"
      build:
        description: "Builds a test greenhouse for a recipe, around you or at the given floor centre"
        parameters: "<recipe> [<x> <y> <z>] [<width>x<depth>x<height>] [keep|clear]"
        bad-coordinates: "<red>Coordinates need all three of x, y and z, as numbers or ~ (e.g. ~ ~ ~ or ~ ~-1 ~5).</red>"
        bad-argument: "<red>[description] is not a size (e.g. 9x9 or 9x9x5) or a mode (keep or clear).</red>"
        too-small: "<red>The recipe does not fit in [size]: [description]. Try a bigger size, or leave it out to size it automatically.</red>"
        out-of-world: "<red>That would go above or below the world. Pick another height.</red>"
        not-on-island: "<red>The whole greenhouse must be on one island.</red>"
        overlapping: "<red>That would overlap greenhouse [id].</red>"
        confirm-clear: "<red>Everything inside a [size] greenhouse here will be replaced.</red>"
        built: "<green>Built a [size] [recipe] test greenhouse ([number] blocks). Making it now...</green>"
      edit:
        description: "Opens the recipe editor, or a recipe's editor"
        parameters: "[recipe]"


