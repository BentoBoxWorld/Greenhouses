    user:
      description: "Abre o menu de seleção de estufas"
      remove:
        description: "Remove a estufa onde se encontra, se for o dono"        
      make:
        description: "Tentar criar uma estufa"
        parameters: "<receita>"
        error:
          already: "<red>Já existe uma estufa aqui!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>O telhado contém blocos não permitidos!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>As paredes contêm blocos não permitidos!</red>"
          FAIL_BELOW: "<red>Deve estar dentro da estufa para tentar criá-la</red>"
          FAIL_BLOCKS_ABOVE: "<red>Não pode haver blocos por cima da estufa! Blocos de vidro vermelho mostrarão os blocos problemáticos.</red>"
          FAIL_HOLE_IN_ROOF: |
            <red>Há um buraco no telhado ou ele não é plano!</red>
            <red>Blocos de vidro vermelho mostrarão o problema.</red>
            <red>Certifique-se de que está dentro da sua estufa para criá-la.</red>
          FAIL_HOLE_IN_WALL: "<red>Há um buraco na parede!</red>"
          FAIL_NO_ROOF: "<red>Parece não haver telhado! Certifique-se de que está dentro da estufa para criá-la.</red>"
          FAIL_TOO_MANY_DOORS: "<red>Não pode ter mais de 4 portas na estufa!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>Apenas um funil é permitido nas paredes ou no telhado.</red>"
          FAIL_UNEVEN_WALLS: "<red>As paredes estão desiguais. Blocos de vidro vermelho mostrarão os blocos problemáticos.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Gelo insuficiente para criar esta receita</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Lava insuficiente para criar esta receita</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Água insuficiente para criar esta receita</red>"
          FAIL_NO_ICE: "<red>É necessário gelo para criar esta receita</red>"
          FAIL_NO_LAVA: "<red>É necessária lava para criar esta receita</red>"
          FAIL_NO_WATER: "<red>É necessária água para criar esta receita</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Nenhuma receita correspondente encontrada para esta estufa</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>São necessários mais blocos para criar esta receita!</red>"
          FAIL_OVERLAPPING: "<red>Desculpe, as estufas não podem partilhar paredes.</red>"
        success: "<dark_green>Criou com sucesso uma estufa de bioma [biome]! O bioma será sincronizado no próximo teletransporte ou login.</dark_green>"
        missing-blocks: "<red>Em falta [material] x [number]</red>"
        unknown-recipe: "<red>Receita desconhecida</red>"
        try-these: "<red>Tente uma destas:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Como construir uma estufa]</green>"
        instructions: |
          <yellow>Crie uma caixa de vidro com 4 paredes e um telhado</yellow>
          <yellow>de vidro plano, e adicione até </yellow><white>4 portas </white><yellow>nas paredes.</yellow>
          <yellow>Coloque </yellow><white>1 funil </white><yellow>numa parede ou telhado e adicione baldes</yellow>
          <yellow>de água para criar neve e/ou farinha de osso para cultivar</yellow>
          <yellow>plantas automaticamente. Verifique as receitas de biomas</yellow>
          <yellow>para ver que blocos devem estar no interior para ter sucesso.</yellow>

