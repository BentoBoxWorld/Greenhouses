        title: "<green>[Как построить теплицу]</green>"
        instructions: |
          <yellow>Сделайте коробку из стекла с 4 стенами и плоской</yellow>
          <yellow>стеклянной крышей, добавьте до </yellow><white>4 дверей </white><yellow>в стены.</yellow>
          <yellow>Установите </yellow><white>1 воронку </white><yellow>в стену или крышу и добавьте ведра</yellow>
          <yellow>с водой, чтобы автоматически создавать снег и/или костную</yellow>
          <yellow>муку для роста растений. Проверьте рецепты биомов, чтобы</yellow>
          <yellow>узнать, какие блоки должны быть внутри для успеха.</yellow>
