        description: "Показывает полную информацию о теплице"
        parameters: "[id]"
        title: "<green>[Информация о теплице]</green>"
        id: "<gray>ID: </gray><white>[id]</white>"
        recipe: "<gray>Рецепт: </gray><white>[recipe]</white>"
        owner: "<gray>Владелец: </gray><white>[owner]</white>"
        world: "<gray>Мир: </gray><white>[world]</white>"
        location: "<gray>Местоположение: </gray><white>[xyz]</white>"
        bounding-box: "<gray>Ограничивающий прямоугольник: </gray><white>[min] </white><gray>до </gray><white>[max]</white>"
        area: "<gray>Внутренняя площадь: </gray><white>[area] блоков</white>"
        original-biome: "<gray>Оригинальный биом: </gray><white>[biome]</white>"
        hopper: "<gray>Воронка: </gray><white>[hopper]</white>"
        broken: "<gray>Сломана: </gray><white>[broken]</white>"
        not-loaded: "<red>Не загружена: [reason]</red>"
