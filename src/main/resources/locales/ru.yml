        not-on-island: "<red>Вся теплица должна быть на одном острове.</red>"
        overlapping: "<red>Это перекроется с теплицей [id].</red>"
        confirm-clear: "<red>Всё внутри [size] теплицы здесь будет заменено.</red>"
        built: "<green>Построена [size] [recipe] тестовая теплица ([number] блоков). Создание сейчас...</green>"
