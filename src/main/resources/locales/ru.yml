          FAIL_TOO_MANY_HOPPERS: "<red>В стенах или крыше разрешена только одна воронка.</red>"
          FAIL_UNEVEN_WALLS: "<red>Стены неровные. Красные стеклянные блоки покажут проблемные места.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Недостаточно льда для этого рецепта</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Недостаточно лавы для этого рецепта</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Недостаточно воды для этого рецепта</red>"
          FAIL_NO_ICE: "<red>Для этого рецепта требуется лед</red>"
          FAIL_NO_LAVA: "<red>Для этого рецепта требуется лава</red>"
          FAIL_NO_WATER: "<red>Для этого рецепта требуется вода</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Не найдено подходящего рецепта для этой теплицы</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Для этого рецепта требуется больше блоков!</red>"
          FAIL_OVERLAPPING: "<red>Извините, теплицы не могут иметь общие стены.</red>"
        success: "<dark_green>Вы успешно создали теплицу биома [biome]! Биом обновится при следующей телепортации или входе.</dark_green>"
