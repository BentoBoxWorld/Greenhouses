###########################################################################################
protection:
  flags:
    GREENHOUSE:
      name: Теплицы
      description: |
        <aqua>Переключить, кто может</aqua>
        <aqua>управлять теплицами   </aqua>

greenhouses:
  general:
   greenhouses: "Теплицы"
   
  errors:
    move: "Сначала перейдите в теплицу, которой вы владеете."
    no-rank: "<red>У вас недостаточно прав для этого.</red>"
    notyours: "Это не ваша теплица!"
    not-inside: "<red>Вы не в теплице!</red>"
    tooexpensive: "Вы не можете себе это позволить [price]" 
    alreadyexists: "Теплица уже существует!"
    norecipe: "Невозможно создать теплицу!"
    
  event:
   broke: "Вы сломали эту теплицу! Возвращаем биом на [biome]!"
   entering: "Вход в теплицу: [biome]"
   leaving: "Выход из теплицы: [biome]"
   
  recipe:
   watermustbe: "Вода > [coverage]% площади пола."
   icemustbe: "Блоки льда > [coverage]% площади пола."
   lavamustbe: "Лава > [coverage]% площади пола."
   minimumblockstitle: "[Минимум необходимых блоков]"
   nootherblocks: "Другие блоки не требуются."
   missing: "Теплица отсутствует"
   
  commands:
    user:
      description: "Открывает меню выбора теплиц"
      remove:
        description: "Удаляет теплицу, в которой вы стоите, если вы являетесь владельцем"        
      make:
        description: "Попробовать создать теплицу"
        parameters: "<рецепт>"
        error:
          already: "<red>Здесь уже есть теплица!</red>"
          FAIL_BAD_ROOF_BLOCKS: "<red>Крыша содержит недопустимые блоки!</red>"
          FAIL_BAD_WALL_BLOCKS: "<red>Стены содержат недопустимые блоки!</red>"
          FAIL_BELOW: "<red>Вы должны находиться внутри теплицы, чтобы создать её</red>"
          FAIL_BLOCKS_ABOVE: "<red>Над теплицей не должно быть блоков! Красные стеклянные блоки покажут проблемные места.</red>"
          FAIL_HOLE_IN_ROOF: |
            <red>В крыше дыра или она не плоская!</red>
            <red>Красные стеклянные блоки покажут проблему.</red>
            <red>Убедитесь, что вы находитесь внутри теплицы при создании.</red>
          FAIL_HOLE_IN_WALL: "<red>В стене дыра!</red>"
          FAIL_NO_ROOF: "<red>Похоже, крыша отсутствует! Убедитесь, что вы находитесь внутри теплицы.</red>"
          FAIL_TOO_MANY_DOORS: "<red>В теплице не может быть более 4 дверей!</red>"
          FAIL_TOO_MANY_HOPPERS: "<red>В стенах или крыше разрешена только одна воронка.</red>"
          FAIL_UNEVEN_WALLS: "<red>Стены неровные. Красные стеклянные блоки покажут проблемные места.</red>"
          FAIL_INSUFFICIENT_ICE: "<red>Недостаточно льда для этого рецепта</red>"
          FAIL_INSUFFICIENT_LAVA: "<red>Недостаточно лавы для этого рецепта</red>"
          FAIL_INSUFFICIENT_WATER: "<red>Недостаточно воды для этого рецепта</red>"
          FAIL_NO_ICE: "<red>Для этого рецепта требуется лед</red>"
          FAIL_NO_LAVA: "<red>Для этого рецепта требуется лава</red>"
          FAIL_NO_WATER: "<red>Для этого рецепта требуется вода</red>"
          FAIL_NO_RECIPE_FOUND: "<red>Не найдено подходящего рецепта для этой теплицы</red>"
          FAIL_INSUFFICIENT_BLOCKS: "<red>Для этого рецепта требуется больше блоков!</red>"
          FAIL_OVERLAPPING: "<red>Извините, теплицы не могут иметь общие стены.</red>"
        success: "<dark_green>Вы успешно создали теплицу биома [biome]! Биом обновится при следующей телепортации или входе.</dark_green>"
        missing-blocks: "<red>Отсутствует [material] x [number]</red>"
        unknown-recipe: "<red>Неизвестный рецепт</red>"
        try-these: "<red>Попробуйте один из этих:</red>"
        recipe-format: "<dark_aqua>[name]</dark_aqua>"
      info:
        title: "<green>[Как построить теплицу]</green>"
        instructions: |
          <yellow>Сделайте коробку из стекла с 4 стенами и плоской</yellow>
          <yellow>стеклянной крышей, добавьте до </yellow><white>4 дверей </white><yellow>в стены.</yellow>
          <yellow>Установите </yellow><white>1 воронку </white><yellow>в стену или крышу и добавьте ведра</yellow>
          <yellow>с водой, чтобы автоматически создавать снег и/или костную</yellow>
          <yellow>муку для роста растений. Проверьте рецепты биомов, чтобы</yellow>
          <yellow>узнать, какие блоки должны быть внутри для успеха.</yellow>

######### Старая локализация для справки
help:
   help: "помощь"
   make: "Пытается создать теплицу"
   remove: "Удаляет теплицу, в которой вы стоите, если вы владелец"
   info: "Как создать теплицу"
   list: "Список всех доступных биомов теплиц"
   recipe: "Рассказывает, как создать биом теплицы"
   opengui: "Открывает меню теплиц"

list:
   title: "[Рецепты биомов теплиц]"
   info: "Используйте /greenhouse recipe <номер>, чтобы увидеть детали"

