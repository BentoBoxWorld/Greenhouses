        success: "<green>Теплица [id] удалена.</green>"
      tp:
        description: "Телепортирует вас в теплицу"
        parameters: "<id>"
        success: "<green>Телепортированы в теплицу [id]</green>"
      verify:
        description: "Переконтролирует теплицы на соответствие их рецепту"
        parameters: "[id]"
        checking: "<gray>Проверка [number] теплиц(ы)...</gray>"
        ok: "<green>[id] в [xyz] соответствует её рецепту</green>"
        broken: "<red>[id] в [xyz] не соответствует: [reasons]</red>"
      reload:
